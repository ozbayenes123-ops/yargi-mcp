name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Bagimliliklari kur (dev extra dahil)
        run: uv sync --extra dev
      - name: Sunucu modulu import edilebiliyor mu
        run: uv run --no-sync python -c "import mcp_server_main; print('mcp_server_main ok')"
      - name: Testler
        run: uv run --no-sync python -m pytest tests -q
